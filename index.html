<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arcade — Game Hub</title>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --ink:#0E0B16;
    --panel:#1B1626;
    --panel-2:#241D33;
    --gold:#F6C453;
    --gold-deep:#D9A431;
    --red:#E8425A;
    --cream:#F3EDE3;
    --muted:#8A7F99;
    --line:#332A47;
    --display:Haettenschweiler,"Arial Narrow Bold",Impact,"Segoe UI",sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--panel-2) 0%, var(--ink) 60%),
      var(--ink);
    color:var(--cream);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  a:focus-visible, button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px;}

  .marquee{
    text-align:center;
    padding:clamp(40px,8vw,72px) 24px 24px;
  }
  .marquee .eyebrow{
    display:inline-flex;
    gap:.5em;
    font-size:.8rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.85;
  }
  .marquee h1{
    font-family:var(--display);
    font-weight:400;
    letter-spacing:.02em;
    font-size:clamp(2.6rem,7vw,5rem);
    margin:.2em 0 .1em;
    background:linear-gradient(180deg,var(--cream),var(--gold) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .marquee p{
    color:var(--muted);
    max-width:38em;
    margin:0 auto;
    font-size:1rem;
  }

  main{
    max-width:1000px;
    margin:0 auto;
    padding:24px clamp(16px,4vw,48px) 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:24px;
  }

  .cabinet{
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .cabinet:hover, .cabinet:focus-visible{
    transform:translateY(-4px);
    border-color:var(--gold-deep);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6), 0 0 0 1px var(--gold-deep) inset;
  }
  .cabinet .screen{
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 2px, transparent 2px 4px),
      radial-gradient(120% 140% at 50% 0%, var(--panel-2), var(--ink));
    border-bottom:1px solid var(--line);
    letter-spacing:.15em;
  }
  .cabinet .info{
    padding:18px 20px 22px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cabinet .tag{
    font-size:.7rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .cabinet h2{
    font-family:var(--display);
    font-weight:400;
    font-size:1.5rem;
    letter-spacing:.02em;
    margin:0;
  }
  .cabinet p{
    margin:0;
    color:var(--muted);
    font-size:.9rem;
    line-height:1.5;
  }
  .cabinet .play{
    margin-top:10px;
    align-self:flex-start;
    font-size:.8rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--red);
  }

  .empty-slot{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:220px;
    border:1px dashed var(--line);
    border-radius:16px;
    color:var(--muted);
    font-size:.85rem;
    letter-spacing:.05em;
    text-align:center;
    padding:20px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    padding:20px;
  }
</style>
</head>
<body>

  <div class="marquee">
    <span class="eyebrow">Now loading</span>
    <h1>The Arcade</h1>
    <p>A shelf of small team games, built one at a time. Pick a cabinet to play.</p>
  </div>

  <main>
    <div class="grid">

      <a class="cabinet" href="emoji-movie-challenge/">
        <div class="screen">🎬🍿</div>
        <div class="info">
          <span class="tag">Guessing game</span>
          <h2>Emoji Movie Challenge</h2>
          <p>Classics and anime, told entirely in emoji. How many can you crack?</p>
          <span class="play">Play →</span>
        </div>
      </a>

      <div class="empty-slot">More cabinets coming soon</div>

    </div>
  </main>

  <footer>Built with HTML, one game at a time.</footer>

</body>
</html>
