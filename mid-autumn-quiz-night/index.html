<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Mid-Autumn Quiz Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900&family=Karla:wght@400;600;700;800&family=Noto+Serif+SC:wght@400;600;900&display=swap">


</head>
<body>
<style>
/* A projector screen at night — deliberately single-theme, painted explicitly. */
:root{
  --night:#0A0D1B;
  --night-2:#121732;
  --panel:#171D3B;
  --line:#2C3560;
  --line-soft:#1F264A;
  --ink:#EFEDF7;
  --ink-2:#B9BCD8;
  --muted:#7E85AB;
  --amber:#F0B653;
  --amber-deep:#C98A22;
  --cinnabar:#E4604C;
  --jade:#5FC79B;
  --violet:#9D8BE8;
  --radius:4px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(240,182,83,.16), transparent 62%),
    radial-gradient(760px 520px at 8% 108%, rgba(228,96,76,.13), transparent 66%),
    var(--night);
  color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.cjk{font-family:"Noto Serif SC","Songti SC",serif}
h1,h2,h3,p{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}

#app{
  min-height:100svh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  max-width:1500px;margin:0 auto;
}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:20px;
  padding:16px 26px;border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:baseline;gap:12px;min-width:0;
  background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.brand:hover .zh,.brand:active .zh{color:var(--amber-glow)}
.brand .zh{transition:color .15s}
.brand .zh{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;letter-spacing:.1em;color:var(--amber)}
.brand .en{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.roundtag{
  margin-left:auto;display:flex;align-items:center;gap:14px;
  font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
}
.roundtag b{color:var(--ink-2);letter-spacing:.14em}
.counter{font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- session clock ---------- */
.sess{
  font-family:"Bodoni Moda",Georgia,serif;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--ink-2);
  border-left:1px solid var(--line);padding-left:16px;
}
.sess i{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.sess.over{color:var(--cinnabar)}
.sess.idle{color:var(--muted)}

/* ---------- timer ---------- */
.timer{display:flex;align-items:center;gap:10px}
.timer svg{display:block;transform:rotate(-90deg)}
.timer .track{fill:none;stroke:var(--line);stroke-width:4}
.timer .prog{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}
.timer.low .prog{stroke:var(--cinnabar)}
.timer .num{
  font-family:"Bodoni Moda",Georgia,serif;font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right;
}
.timer.low .num{color:var(--cinnabar)}
.timer.idle .num{color:var(--muted)}

/* ---------- stage ---------- */
.stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:44px 40px;text-align:center;min-height:0;
  overflow-y:auto;overflow-x:hidden;
}
/* keeps a card taller than the stage from being clipped at the top */
@supports (justify-content: safe center){ .stage{justify-content:safe center} }
.kicker{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
.pts-badge{
  display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;
  color:#241700;background:var(--amber);border-radius:99px;padding:3px 12px;
}

.q-cjk{
  font-family:"Noto Serif SC",serif;font-weight:600;
  font-size:clamp(34px,5.6vw,84px);line-height:1.28;letter-spacing:.10em;
  max-width:22ch;
}
.q-plain{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(26px,3.6vw,54px);line-height:1.2;letter-spacing:-.01em;max-width:26ch;
}
.q-emoji{font-size:clamp(56px,11vw,150px);line-height:1.1;letter-spacing:.06em}
.gloss{font-size:clamp(15px,1.5vw,21px);color:var(--ink-2);max-width:52ch}

.answer{
  border-top:1px solid var(--line);padding-top:22px;margin-top:4px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.answer .big{
  font-family:"Noto Serif SC",serif;font-weight:900;color:var(--jade);
  font-size:clamp(38px,6vw,86px);line-height:1.1;letter-spacing:.06em;
}
.answer .big.latin{font-family:"Bodoni Moda",Georgia,serif;letter-spacing:0}
.answer .why{font-size:clamp(14px,1.4vw,19px);color:var(--ink-2);max-width:56ch}
.veil{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  border-top:1px solid var(--line);padding-top:22px;margin-top:4px;
}
.peek{
  position:fixed;top:78px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 16px;font-size:14px;color:var(--amber);box-shadow:0 12px 32px rgba(0,0,0,.5);
  display:none;z-index:20;
}
.peek.on{display:block}
.peek b{font-family:"Noto Serif SC",serif;font-size:18px}

/* language badge */
.lang{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:3px 12px;color:var(--muted);
}
.lang.any{color:var(--jade);border-color:rgba(95,199,155,.45)}
.lang.zh{color:var(--violet);border-color:rgba(157,139,232,.45)}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* assist / shape puzzle */
.assist{
  border-top:1px solid var(--line);margin-top:4px;padding-top:22px;
  display:flex;flex-direction:column;align-items:center;gap:16px;max-width:64ch;
}
.assist .ah{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}
.assist .aq{font-size:clamp(16px,1.9vw,24px);color:var(--ink);max-width:46ch}
.eq{
  font-family:"Noto Serif SC",serif;font-weight:600;
  font-size:clamp(30px,4.4vw,60px);letter-spacing:.08em;line-height:1.3;color:var(--amber);
}
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.opts span{
  font-family:"Noto Serif SC",serif;font-weight:600;
  font-size:clamp(34px,4.6vw,62px);line-height:1;
  border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;min-width:1.9em;background:var(--night-2);
  transition:border-color .2s,color .2s,background .2s;
}
.opts span.hit{border-color:var(--jade);color:var(--jade);background:rgba(95,199,155,.12)}
.opts span.miss{opacity:.3}
.assist .aa{font-size:clamp(16px,1.8vw,22px);font-weight:700;color:var(--jade)}
.guessline{
  font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(15px,1.6vw,20px);
  color:var(--muted);letter-spacing:.02em;
}

/* verdict buttons for true/false */
.tf{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tf span{
  border:1px solid var(--line);border-radius:99px;padding:8px 22px;
  font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.tf span.hit{border-color:var(--jade);color:var(--jade);background:rgba(95,199,155,.10)}
.tf span.miss{opacity:.35}

/* ---------- intro ----------
   Left-aligned composition: the stage centres its children, but centred
   running text and a 3x2 card grid both waste the width. A masthead with a
   meta block pushed to the right edge, then the rounds as one table, fills it. */
.intro{
  width:100%;max-width:1020px;text-align:left;
  display:flex;flex-direction:column;align-items:stretch;gap:0;
}
.masthead{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;
}
.intro .kicker{margin:0 0 15px}
.intro .hero-zh{
  font-family:"Noto Serif SC",serif;font-weight:900;
  font-size:clamp(42px,6.6vw,92px);line-height:1;letter-spacing:.08em;color:var(--amber);
  margin:0 0 4px;
}
.intro h1{
  font-family:"Bodoni Moda",Georgia,serif;font-weight:600;
  font-size:clamp(23px,2.9vw,40px);line-height:1.06;letter-spacing:-.01em;
}
.intro .when{font-size:14.5px;color:var(--muted);letter-spacing:.02em;margin-top:9px}
.metablock{display:flex;gap:0;align-self:end}
.metablock div{padding:0 0 0 22px;margin-left:22px;border-left:1px solid var(--line)}
.metablock div:first-child{margin-left:0}
.metablock dt{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.metablock dd{
  margin:0;font-family:"Bodoni Moda",Georgia,serif;font-weight:700;
  font-size:24px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.metablock dd small{font-family:"Karla",sans-serif;font-size:12px;font-weight:600;color:var(--ink-2);margin-left:3px}

/* rounds grid — the card look, with every cell's footer on one baseline so
   uneven titles above don't leave ragged dead space */
.agenda{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);
  margin-top:30px;
}
.ag{background:var(--night-2);padding:18px 20px 18px;display:flex;flex-direction:column}
.ag .n{
  font-family:"Bodoni Moda",Georgia,serif;font-size:11.5px;font-weight:700;
  letter-spacing:.16em;color:var(--amber);
}
.ag.special .n{color:var(--cinnabar)}
.ag .zh{
  font-family:"Noto Serif SC",serif;font-size:21px;font-weight:600;
  letter-spacing:.04em;margin-top:7px;line-height:1.2;
}
.ag .en{font-size:15px;color:var(--ink);margin-top:7px;line-height:1.3}
.ag .note{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
.ag .foot{
  margin-top:auto;padding-top:16px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.ag .cnt{font-family:"Bodoni Moda",Georgia,serif;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.ag .cnt small{font-family:"Karla",sans-serif;font-size:11px;font-weight:600;color:var(--muted);margin-left:4px}
.ag .lg{
  font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap;
}
.ag .lg.any{color:var(--jade);border-color:rgba(95,199,155,.4)}
.ag .lg.zh{color:var(--violet);border-color:rgba(157,139,232,.4)}

/* closing notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:24px 40px;margin-top:30px}
.notes .hd{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.notes p{font-size:14px;line-height:1.55;color:var(--ink-2);max-width:44ch}
.notes b{color:var(--ink)}

/* ---------- round card / final ---------- */

.roundcard{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:44ch}
.roundcard .n{font-family:"Bodoni Moda",Georgia,serif;font-size:14px;font-weight:700;letter-spacing:.22em;color:var(--amber)}
.roundcard .zh{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(40px,7vw,80px);letter-spacing:.1em}
.roundcard h2{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:clamp(22px,2.6vw,34px)}
.roundcard .how{font-size:15.5px;color:var(--ink-2)}

.final{width:100%;max-width:820px}
.final h2{font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(26px,3.4vw,42px);margin-bottom:6px}
.podium{display:flex;flex-direction:column;gap:8px;margin-top:24px;text-align:left}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:14px 18px;background:var(--night-2);border:1px solid var(--line)}
.prow.gold{border-color:var(--amber);background:rgba(240,182,83,.10)}
.prow .rk{font-family:"Bodoni Moda",Georgia,serif;font-size:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.prow.gold .rk{color:var(--amber)}
.prow .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prow .nm .zh{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600}
.prow .nm .en{font-size:13px;color:var(--muted);letter-spacing:.06em}
.prow .sc{font-family:"Bodoni Moda",Georgia,serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- score strip ---------- */
.strip{border-top:1px solid var(--line);background:var(--night)}
/* 1px gaps over a line-coloured ground give clean rules at any column count */
.teams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line)}
.tcell{
  border:0;padding:11px 14px 12px;
  display:flex;flex-direction:column;gap:6px;position:relative;
  background:var(--night);cursor:pointer;text-align:left;
  transition:background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.tcell:hover,.tcell:active{background:rgba(240,182,83,.12)}
body.deduct .tcell:hover,body.deduct .tcell:active{background:rgba(228,96,76,.14)}
.tcell .row1{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.tcell .zh{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;color:var(--amber)}
.tcell .sc{font-family:"Bodoni Moda",Georgia,serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.tcell .en{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcell .key{position:absolute;top:8px;right:10px;font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.tcell .bar{height:4px;background:var(--line)}
.tcell .bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.tcell.lead .bar i{background:var(--jade)}
.tcell.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:rgba(95,199,155,.35)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.tcell.flash{animation:none}}

.helpbar{
  display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;
  padding:9px 26px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);
}
.helpbar .keys{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.helpbar kbd{
  font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
  padding:1px 6px;color:var(--ink-2);background:var(--panel);
}
.helpbar .main{margin-left:auto;display:flex;gap:8px}
.helpbar .util{display:flex;gap:8px;flex-wrap:wrap}
.ctrl{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.ctrl:hover,.ctrl:active{border-color:var(--amber);color:var(--amber)}
.ctrl:disabled{opacity:.35;cursor:default}
.ctrl:disabled:hover{border-color:var(--line);color:var(--ink)}
.ctrl.primary{background:var(--amber);border-color:var(--amber);color:#241700}
.ctrl.primary:hover,.ctrl.primary:active{color:#241700;filter:brightness(1.08)}
.ctrl.danger{background:var(--cinnabar);border-color:var(--cinnabar);color:#2A0A05}
.ctrl.danger:hover,.ctrl.danger:active{color:#2A0A05;filter:brightness(1.08)}

/* ---------- intro: narrow ---------- */
@media (max-width:1000px){
  .agenda{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .masthead{grid-template-columns:1fr;gap:22px}
  .metablock{align-self:start}
  .metablock div{
    padding:0 18px 0 0;margin:0 18px 0 0;
    border-left:0;border-right:1px solid var(--line);
  }
  .metablock div:last-child{border-right:0;margin-right:0;padding-right:0}
  .metablock dd{font-size:20px}
  .agenda{grid-template-columns:1fr;margin-top:24px}
  .ag{padding:15px 16px}
  .ag .foot{padding-top:12px}
  .notes{margin-top:26px;gap:20px}
  .notes p{font-size:13.5px}
}

/* ---------- tablet ---------- */
@media (max-width:900px){
  .teams{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{padding:30px 22px}
  .helpbar .keys{display:none}
  .helpbar{padding:9px 16px;gap:8px}
  .helpbar .main{margin-left:0;flex:1 1 100%}
  .helpbar .main .ctrl{flex:1 1 0;min-height:44px;font-size:13px;padding:6px 8px}
  .helpbar .util{flex:1 1 100%;justify-content:space-between}
  .helpbar .util .ctrl{flex:1 1 0;min-height:34px;font-size:11px;padding:5px 4px;white-space:nowrap}
}

/* ---------- phone ---------- */
@media (max-width:620px){
  .topbar{padding:10px 14px;gap:10px}
  .brand .en{display:none}
  .brand .zh{font-size:18px}
  .roundtag{gap:10px;font-size:10px;letter-spacing:.1em}
  .sess{padding-left:10px;font-size:13px}
  .timer svg{width:28px;height:28px}
  .timer .num{font-size:18px}

  .stage{padding:22px 16px;gap:16px}
  .q-cjk{letter-spacing:.06em;line-height:1.34;max-width:none}
  .gloss{font-size:14.5px}
  .opts{gap:8px}
  .opts span{padding:9px 12px;font-size:32px;min-width:1.6em}
  .eq{font-size:27px;letter-spacing:.04em}
  .answer,.veil,.assist{padding-top:16px}
  .tf span{padding:7px 16px;font-size:12px}
  .prow{grid-template-columns:32px 1fr auto;gap:10px;padding:11px 13px}

  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tcell{padding:9px 11px 10px}
  .tcell .zh{font-size:15px}
  .tcell .sc{font-size:19px}
  .tcell .key{display:none}
  .peek{top:70px;bottom:auto}
}
@media (max-width:380px){
  .helpbar .util .ctrl{font-size:10px;padding:5px 2px}
}
</style>

<div id="app">
  <div class="topbar">
    <button class="brand" id="btnHome" type="button" title="Back to the title card (Home)">
      <span class="zh">中秋灯谜夜</span>
      <span class="en">Inistate · Happy Friday · 18 Sep 2026</span>
    </button>
    <div class="roundtag">
      <span id="roundLabel">Press start</span>
      <span class="counter" id="counter"></span>
      <span class="sess" id="sess" title="Elapsed session time · target 60 minutes of cards">00:00<i>/60</i></span>
      <span class="timer idle" id="timer">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <circle class="track" cx="17" cy="17" r="14"></circle>
          <circle class="prog" id="prog" cx="17" cy="17" r="14" stroke-dasharray="87.96" stroke-dashoffset="0"></circle>
        </svg>
        <span class="num" id="clock">—</span>
      </span>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="strip">
    <div class="teams" id="teams"></div>
    <div class="helpbar">
      <span class="keys">
        <span><kbd>Space</kbd> next</span>
        <span><kbd>←</kbd> back</span>
        <span><kbd>R</kbd> reveal</span>
        <span><kbd>T</kbd> timer</span>
        <span><kbd>A</kbd> assist</span>
        <span><kbd>N</kbd> next round</span>
        <span><kbd>H</kbd> peek</span>
        <span><kbd>1</kbd>–<kbd>6</kbd> award · <kbd>⇧</kbd> deduct</span>
        <span><kbd>⌫</kbd> undo</span>

  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five words for “moon” in five different languages.", a:"moon · 月亮 yuèliang · bulan (Malay) · चाँद chaand (Hindi) · நிலா nila (Tamil) · 月 tsuki (Japanese) · 달 dal (Korean) · luna", latin:true, why:"Everybody in the room has one. This card is why nobody sits it out.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five teas — and none of the six team names count.", a:"龙井 longjing · 铁观音 tieguanyin · 大红袍 da hong pao · 碧螺春 biluochun · 大麦茶 barley tea · teh tarik · English breakfast · green · black", latin:true, why:"The obvious six are sitting in front of them with team names on. Make them work past it.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five things you can see in the night sky without a telescope.", a:"Moon · stars · planets · the Milky Way · meteors · satellites · clouds · aircraft", latin:true, why:"Accept anything genuinely visible. Do not accept the far side of the moon.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five countries whose flag carries a moon.", a:"Malaysia · Singapore · Turkey · Pakistan · Algeria · Tunisia · Mauritania · Azerbaijan · Uzbekistan · Nepal", latin:true, why:"Ours is one of them, and nobody ever gets it first.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five lunar missions or moon programmes.", a:"Apollo 11 · Chang'e (China) · Chandrayaan (India) · Artemis · Luna · Surveyor · Apollo 13", latin:true, why:"China named its programme after the woman who flew there first, and India named its after the moon itself.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five Malaysian desserts.", a:"Kuih lapis · cendol · ais kacang · onde-onde · seri muka · pulut hitam · kuih talam · bubur cha cha", latin:true, why:"The one round where the pantry conversation finally pays off.", pts:20, secs:30},
  {kind:"q", r:5, form:"plain", lang:"any", q:"Name five words that rhyme with “moon”.", a:"Soon · spoon · noon · June · tune · balloon · monsoon · cartoon · dune", latin:true, why:"Pure filler, and the loudest round of the night.", pts:20, secs:30},

  {kind:"round", n:"FINALE", zh:"巅峰一谜", en:"Sudden Death",
   how:"Top two teams only, and no Chinese needed to win it. Three cards, getting harder. Each team writes one answer, no shouting, then both are read out together. First card either team gets right takes the 50 points and the title — so if the first card splits them, the rest never get played."},
  {kind:"q", r:6, form:"plain", lang:"any", q:"Mid-Autumn 2025 fell on 6 October. In 2026 it falls on 25 September — eleven days earlier. Why does the date walk backwards each year?", a:"The lunar year is about 11 days shorter than the solar year", latin:true, why:"Twelve lunar months come to 354 days against the sun's 365 — and it is exactly 354 days from 6 Oct 2025 to 25 Sep 2026. The festival slides earlier every year until a leap month is inserted and it jumps forward again. Accept any answer that gets the lunar-vs-solar mismatch.", pts:50, secs:75},
  {kind:"q", r:6, form:"plain", lang:"any", q:"The moon rises roughly 50 minutes later each night. So why does the full moon, of all of them, rise just as the sun is setting?", a:"Because “full” means the moon is opposite the sun", latin:true, why:"A full moon is the moon on the far side of Earth from the sun — so it has to come up as the sun goes down, and it stays up all night. That is the only reason a Mid-Autumn evening works at all.", pts:50, secs:75},
  {kind:"q", r:6, form:"guess", lang:"any", q:"Tiebreak. The moon is drifting away from Earth. How many centimetres further away does it get each year? Closest wins.", a:"About 3.8 cm a year", latin:true, why:"Measured by bouncing lasers off the reflectors the Apollo missions left behind. Over a human lifetime the moon retreats about three metres — so tonight's moon is very slightly smaller than the one your grandparents looked at.", pts:50, secs:45},

  {kind:"final"}
];

const ROUND_NAMES = {
  1:"Round 1 · 灯谜闯关",
  2:"Round 2 · 表情包猜谜",
  3:"Round 3 · 真假中秋",
  4:"Round 4 · 同一个月亮",
  5:"Bonus · 三十秒五样",
  6:"Finale · 巅峰一谜"
};

/* ------------------------------------------------------------------ state */
const SKEY = 'mid-autumn-quiz-2026';
let scores, idx = 0, revealed = false, assistOn = false, history = [];
try { scores = JSON.parse(localStorage.getItem(SKEY)); } catch(e) { scores = null; }
if (!Array.isArray(scores) || scores.length !== TEAMS.length) scores = TEAMS.map(() => 0);
function persist(){ try { localStorage.setItem(SKEY, JSON.stringify(scores)); } catch(e) {} }

/* ------------------------------------------------------------------ timer */
const CIRC = 2 * Math.PI * 14;
let tLeft = 0, tTotal = 0, tId = null;
const elTimer = document.getElementById('timer');
const elClock = document.getElementById('clock');
const elProg  = document.getElementById('prog');
elProg.setAttribute('stroke-dasharray', CIRC.toFixed(2));

function paintTimer(){
  if (!tTotal){
    elClock.textContent = '—';
    elProg.setAttribute('stroke-dashoffset', CIRC.toFixed(2));
    elTimer.className = 'timer idle';
    return;
  }
  elClock.textContent = tLeft;
  elProg.setAttribute('stroke-dashoffset', (CIRC * (1 - tLeft / tTotal)).toFixed(2));
  elTimer.className = 'timer' + (tLeft <= 5 ? ' low' : '') + (tId ? '' : ' idle');
}
function armTimer(secs){
  clearInterval(tId); tId = null;
  tTotal = secs || 0; tLeft = tTotal;
  paintTimer();
}
function toggleTimer(){
  if (!tTotal) return;
  if (tId){ clearInterval(tId); tId = null; paintTimer(); return; }
  if (tLeft === 0) tLeft = tTotal;
  tId = setInterval(() => {
    tLeft--;
    if (tLeft <= 0){ tLeft = 0; clearInterval(tId); tId = null; }
    paintTimer();
  }, 1000);
  paintTimer();
}

/* ------------------------------------------------------------------ render */
const stage = document.getElementById('stage');
const elRound = document.getElementById('roundLabel');
const elCount = document.getElementById('counter');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function questionsInRound(r){ return DECK.filter(d => d.kind === 'q' && d.r === r); }

function render(){
  const it = DECK[idx];
  document.getElementById('btnReveal').disabled = it.kind !== 'q';
  const bA = document.getElementById('btnAssist');
  bA.disabled = !(it.kind === 'q' && it.assist && it.form !== 'shape');
  bA.classList.toggle('primary', assistOn && !bA.disabled);
  document.getElementById('btnPeek').disabled = it.kind !== 'q';
  document.getElementById('btnTimer').disabled = it.kind !== 'q';
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnHomeBtn').disabled = idx === 0;
  const bN = document.getElementById('btnNext');
  bN.disabled = idx === DECK.length - 1;
  bN.textContent = idx === 0 ? 'Start ▶' : 'Next ▶';
  setPeek(false);

  if (it.kind === 'intro'){
    elRound.textContent = 'Press start';
    elCount.textContent = '';
    armTimer(0);
    const cards = DECK.filter(d => d.kind === 'q');
    const nIn = r => cards.filter(c => c.r === r).length;
    const board = cards.filter(c => c.r !== 6).reduce((a,c) => a + c.pts, 0) + 50;
    const openPts = cards.filter(c => c.lang === 'any' && c.r !== 6).reduce((a,c) => a + c.pts, 0) + 50;

    const ROWS = [
      {r:1, tag:'ROUND 01', zh:'灯谜闯关', en:'Riddle Rush',              note:'shout it, or press A for the shape puzzle', lang:'zh'},
      {r:2, tag:'ROUND 02', zh:'表情包猜谜', en:'Emoji Decode',            note:'30 seconds a card',                        lang:'any'},
      {r:3, tag:'ROUND 03', zh:'真假中秋', en:'Fact or Folklore',          note:'buzz in · +15 / −15',                      lang:'any'},
      {r:4, tag:'ROUND 04', zh:'同一个月亮', en:'One Moon, Many Festivals', note:'India · Japan · Korea · Vietnam',          lang:'any'},
      {r:5, tag:'BONUS',    zh:'三十秒五样', en:'Name Five in Thirty',      note:'the flex round — drop or add at will',      lang:'any', special:true},
      {r:6, tag:'FINALE',   zh:'巅峰一谜', en:'Sudden Death',              note:'escalating · one card decides it',         lang:'any', special:true}
    ];

    stage.innerHTML =
      '<div class="intro">'
      + '<div class="masthead">'
        + '<div>'
          + '<p class="kicker">Happy Friday · Friday 18 September 2026 · one week to 中秋节</p>'
          + '<p class="hero-zh cjk">中秋灯谜夜</p>'
          + '<h1>Mid-Autumn Quiz Night</h1>'
          + '<p class="when">4:00 – 5:15 pm · one screen, no paper, no props</p>'
        + '</div>'
        + '<dl class="metablock">'
          + '<div><dt>Cards</dt><dd>' + cards.length + '</dd></div>'
          + '<div><dt>Target</dt><dd>60<small>min</small></dd></div>'
          + '<div><dt>Teams</dt><dd>6<small>× 4</small></dd></div>'
        + '</dl>'
      + '</div>'
      + '<div class="agenda">'
        + ROWS.map(x =>
            '<div class="ag' + (x.special ? ' special' : '') + '">'
            + '<span class="n">' + x.tag + '</span>'
            + '<span class="zh cjk">' + x.zh + '</span>'
            + '<span class="en">' + x.en + '</span>'
            + '<span class="note">' + x.note + '</span>'
            + '<span class="foot">'
              + '<span class="cnt">' + nIn(x.r) + '<small>cards</small></span>'
              + '<span class="lg ' + x.lang + '">' + (x.lang === 'zh' ? '中文 + assist' : 'Any language') + '</span>'
            + '</span>'
            + '</div>').join('')
      + '</div>'
      + '<div class="notes">'
        + '<div><p class="hd">No Chinese needed to win</p><p>Round 1 is the only round where it helps, and every card there has an assist tier — a shape puzzle or English logic, open to everyone, worth half. That leaves <b>' + openPts + ' of the ' + board + ' points</b> answerable in any language.</p></div>'
        + '<div><p class="hd">Round 4 turns the tables</p><p>The autumn moon festivals of India, Japan, Korea and Vietnam — Sharad Purnima, Chuseok, Tsukimi, Tết Trung Thu. On this round the Chinese-reading teams are the ones guessing.</p></div>'
        + '<div><p class="hd">Pacing and the runner rule</p><p>The deck is over-stocked on purpose. Watch the session clock against its 60-minute target and press <b>N</b> to skip a round that drags. A buzz only counts if the team\'s runner touches the screen.</p></div>'
      + '</div>'
      + '</div>';
    return;
  }

  if (it.kind === 'round'){
    elRound.textContent = it.n + ' · ' + it.en;
    elCount.textContent = questionsInRound(DECK.slice(idx).find(d => d.kind === 'q').r).length + ' cards';
    armTimer(0);
    stage.innerHTML =
      '<div class="roundcard">'
      + '<p class="n">' + esc(it.n) + '</p>'
      + '<p class="zh cjk">' + esc(it.zh) + '</p>'
      + '<h2>' + esc(it.en) + '</h2>'
      + '<p class="how">' + esc(it.how) + '</p>'
      + '</div>';
    return;
  }

  if (it.kind === 'final'){
    elRound.textContent = 'Standings';
    elCount.textContent = '';
    armTimer(0);
    renderFinal();
    return;
  }

  /* a question card */
  const inRound = questionsInRound(it.r);
  elRound.textContent = ROUND_NAMES[it.r];
  elCount.textContent = (inRound.indexOf(it) + 1) + ' / ' + inRound.length;
  armTimer(it.secs);

  const shape = it.form === 'shape';
  const showAssist = shape || (assistOn && it.assist);

  let qHtml;
  if (it.form === 'cjk')        qHtml = '<p class="q-cjk cjk">' + esc(it.q) + '</p>';
  else if (it.form === 'emoji') qHtml = '<p class="q-emoji">' + esc(it.q) + '</p>';
  else                          qHtml = '<p class="q-plain">' + esc(it.q) + '</p>';

  /* assist / shape panel */
  let assistHtml = '';
  if (showAssist){
    const A = it.assist;
    assistHtml = '<div class="assist">'
      + (shape ? '' : '<p class="ah">Assist tier · open to everyone · half points</p>')
      + (A.q ? '<p class="aq">' + esc(A.q) + '</p>' : '')
      + (A.eq ? '<p class="eq cjk">' + esc(A.eq) + '</p>' : '')
      + (A.opts ? '<div class="opts">' + A.opts.map(o =>
          '<span class="' + (revealed ? (A.a.charAt(0) === o ? 'hit' : 'miss') : '') + '">' + esc(o) + '</span>'
        ).join('') + '</div>' : '')
      + (revealed && !A.opts ? '<p class="aa">' + esc(A.a) + '</p>' : '')
      + '</div>';
  }

  let ansHtml = '';
  if (!revealed){
    ansHtml = '<div class="veil"><span>Answer hidden</span><span style="letter-spacing:.06em;text-transform:none;font-weight:400">Hold H to peek · press R to reveal'
      + (it.assist && !shape ? ' · press A for the assist tier' : '') + '</span></div>';
  } else if (it.form === 'tf'){
    const fact = it.a === 'FACT';
    ansHtml = '<div class="answer"><div class="tf">'
      + '<span class="' + (fact ? 'hit' : 'miss') + '">Fact</span>'
      + '<span class="' + (fact ? 'miss' : 'hit') + '">Folklore</span>'
      + '</div><p class="why">' + esc(it.why) + '</p></div>';
  } else {
    ansHtml = '<div class="answer"><p class="big' + (it.latin ? ' latin' : ' cjk') + '">' + esc(it.a) + '</p>'
      + '<p class="why">' + esc(it.why) + '</p></div>';
  }

  const langBadge = it.lang === 'zh'
    ? '<span class="lang zh">Chinese · assist available</span>'
    : '<span class="lang any">Any language</span>';

  stage.innerHTML =
    '<div class="badges"><span class="pts-badge">' + currentPts() + ' points'
      + (it.r === 3 ? ' · wrong −15' : '')
      + (showAssist && !shape ? ' · assist tier' : '') + '</span>' + langBadge + '</div>'
    + qHtml
    + (it.en ? '<p class="gloss">' + esc(it.en) + '</p>' : '')
    + (it.form === 'guess' ? '<p class="guessline">Both teams write a number. Closest wins — exact ties go to whoever wrote it first.</p>' : '')
    + (it.form === 'tf' && !revealed ? '<div class="tf"><span>Fact</span><span>Folklore</span></div>' : '')
    + assistHtml
    + ansHtml;
}

function renderFinal(){
  const order = TEAMS.map((t,i) => ({...t, s: scores[i]})).sort((a,b) => b.s - a.s);
  const top = order[0].s;
  stage.innerHTML =
    '<div class="final">'
    + '<p class="kicker">巅峰之夜 · Final standings</p>'
    + '<h2>' + (top > 0 ? esc(order[0].zh) + ' pour the first cup' : 'Nothing on the board yet') + '</h2>'
    + '<p class="gloss" style="margin:0 auto">Champion 150 · runner-up 90 · third 60, as vouchers. Then mooncakes, pomelo and hot tea.</p>'
    + '<div class="podium">'
    + order.map((t,i) =>
        '<div class="prow' + (i === 0 && top > 0 ? ' gold' : '') + '">'
        + '<span class="rk">' + (i+1) + '</span>'
        + '<span class="nm"><span class="zh cjk">' + esc(t.zh) + '</span><span class="en">' + esc(t.en) + '</span></span>'
        + '<span class="sc">' + t.s + '</span>'
        + '</div>').join('')
    + '</div></div>';
}

/* ------------------------------------------------------------------ teams strip */
const elTeams = document.getElementById('teams');
function renderTeams(flashIdx){
  const max = Math.max(100, ...scores);
  const best = Math.max(...scores);
  elTeams.innerHTML = '';
  TEAMS.forEach((t,i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tcell' + (scores[i] === best && best > 0 ? ' lead' : '') + (flashIdx === i ? ' flash' : '');
    b.title = (signMode === -1 ? 'Deduct ' : 'Award ') + currentPts() + ' points '
      + (signMode === -1 ? 'from ' : 'to ') + t.en + ' (key ' + (i+1) + ')';
    b.innerHTML = '<span class="key">' + (i+1) + '</span>'
      + '<span class="row1"><span class="zh cjk"></span><span class="sc"></span></span>'
      + '<span class="en"></span>'
      + '<span class="bar"><i style="width:' + Math.round(Math.max(0,scores[i]) / max * 100) + '%"></i></span>';
    b.querySelector('.zh').textContent = t.zh;
    b.querySelector('.en').textContent = t.en;
    b.querySelector('.sc').textContent = scores[i];
    b.addEventListener('click', () => award(i));
    elTeams.appendChild(b);
  });
}

function currentPts(){
  const it = DECK[idx];
  if (!it || it.kind !== 'q') return 10;
  /* the assist tier is worth half, rounded to the nearest 5 */
  if (assistOn && it.assist && it.form !== 'shape') return Math.round(it.pts / 2 / 5) * 5;
  return it.pts;
}
/* deduct mode: Shift on a keyboard, a sticky toggle on touch */
let signMode = 1;
function setSign(neg){
  signMode = neg ? -1 : 1;
  const b = document.getElementById('btnSign');
  b.textContent = neg ? '− deduct' : '＋ award';
  b.setAttribute('aria-pressed', String(neg));
  b.classList.toggle('danger', neg);
  document.body.classList.toggle('deduct', neg);
  renderTeams();
}
function award(i, sign){
  const s = sign === -1 ? -1 : signMode;
  const delta = currentPts() * s;
  scores[i] = Math.max(0, scores[i] + delta);
  history.push({i, delta});
  persist();
  renderTeams(i);
  if (DECK[idx].kind === 'final') renderFinal();
}
function undo(){
  const last = history.pop();
  if (!last) return;
  scores[last.i] = Math.max(0, scores[last.i] - last.delta);
  persist(); renderTeams();
  if (DECK[idx].kind === 'final') renderFinal();
}

/* ------------------------------------------------------------------ session clock */
const TARGET_MIN = 60;
const elSess = document.getElementById('sess');
let sessionStart = null;
function paintSession(){
  if (!sessionStart){ elSess.className = 'sess idle'; elSess.innerHTML = '00:00<i>/' + TARGET_MIN + '</i>'; return; }
  const s = Math.floor((Date.now() - sessionStart) / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2,'0');
  const ss = String(s % 60).padStart(2,'0');
  elSess.className = 'sess' + (s > TARGET_MIN * 60 ? ' over' : '');
  elSess.innerHTML = mm + ':' + ss + '<i>/' + TARGET_MIN + '</i>';
}
setInterval(paintSession, 1000);
paintSession();

/* ------------------------------------------------------------------ nav */
function go(step){
  const next = idx + step;
  if (next < 0 || next >= DECK.length) return;
  if (!sessionStart && next > 0) { sessionStart = Date.now(); paintSession(); }
  idx = next; revealed = false; assistOn = false; render();
}
/* jump to the next round — the pacing valve when a round is running long */
function nextRound(){
  for (let i = idx + 1; i < DECK.length; i++){
    if (DECK[i].kind === 'round' || DECK[i].kind === 'final'){
      if (!sessionStart) { sessionStart = Date.now(); paintSession(); }
      idx = i; revealed = false; assistOn = false; render();
      return;
    }
  }
}
function toggleAssist(){
  const it = DECK[idx];
  if (it.kind !== 'q' || !it.assist || it.form === 'shape') return;
  assistOn = !assistOn;
  render();
}
function reveal(){
  if (DECK[idx].kind !== 'q') return;
  revealed = true;
  clearInterval(tId); tId = null; paintTimer();
  render();
}

function showStandings(){ idx = DECK.length - 1; revealed = false; assistOn = false; render(); }
/* back to the title card — the session clock and the scores keep running */
function goHome(){ idx = 0; revealed = false; assistOn = false; render(); }

document.getElementById('btnHome').addEventListener('click', goHome);
document.getElementById('btnHomeBtn').addEventListener('click', goHome);

document.getElementById('btnNext').addEventListener('click', () => go(1));
document.getElementById('btnPrev').addEventListener('click', () => go(-1));
document.getElementById('btnReveal').addEventListener('click', reveal);
document.getElementById('btnAssist').addEventListener('click', toggleAssist);
document.getElementById('btnTimer').addEventListener('click', toggleTimer);
document.getElementById('btnSkip').addEventListener('click', nextRound);
document.getElementById('btnStand').addEventListener('click', showStandings);
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnSign').addEventListener('click', () => setSign(signMode === 1));
document.getElementById('btnReset').addEventListener('click', () => {
  scores = TEAMS.map(() => 0); history = []; persist(); renderTeams();
  if (DECK[idx].kind === 'final') renderFinal();
});

const peek = document.getElementById('peek');
const btnPeek = document.getElementById('btnPeek');
function setPeek(on){
  const it = DECK[idx];
  if (on && it.kind === 'q'){
    peek.innerHTML = 'Answer: <b>' + esc(it.a) + '</b>';
    peek.classList.add('on');
  } else {
    peek.classList.remove('on');
  }
  btnPeek.setAttribute('aria-pressed', String(on && it.kind === 'q'));
  btnPeek.classList.toggle('primary', !!(on && it.kind === 'q'));
}
btnPeek.addEventListener('click', () => setPeek(!peek.classList.contains('on')));

/* swipe to change cards on touch */
let tx = 0, ty = 0, tt = 0;
const stageEl = document.getElementById('stage');
stageEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  tx = t.clientX; ty = t.clientY; tt = Date.now();
}, {passive:true});
stageEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Date.now() - tt > 700) return;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 60) return;
  go(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' ' || k === 'ArrowRight' || k === 'PageDown'){ e.preventDefault(); go(1); return; }
  if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); go(-1); return; }
  if (k === 'r' || k === 'R'){ e.preventDefault(); reveal(); return; }
  if (k === 't' || k === 'T'){ e.preventDefault(); toggleTimer(); return; }
  if (k === 'a' || k === 'A'){ e.preventDefault(); toggleAssist(); return; }
  if (k === 'n' || k === 'N'){ e.preventDefault(); nextRound(); return; }
  if (k === 'Backspace'){ e.preventDefault(); undo(); return; }
  if (k === '0'){ e.preventDefault(); showStandings(); return; }
  if (k === 'Home'){ e.preventDefault(); goHome(); return; }
  if (/^[1-6]$/.test(k)){ e.preventDefault(); award(+k - 1, e.shiftKey ? -1 : undefined); return; }
  if ((k === 'h' || k === 'H') && !e.repeat){ setPeek(true); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'h' || e.key === 'H') setPeek(false);
});
window.addEventListener('blur', () => setPeek(false));

renderTeams();
render();
</script>
</body>
</html>
